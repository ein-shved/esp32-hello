[package]
edition      = "2024"
name         = "esp32c6-hello"
rust-version = "1.88"
version      = "0.1.0"

[dependencies]
esp-hal = { version = "1.0.0", features = [
    "log-04",
    "esp32c6",
    # for rtos
    "unstable"
] }

esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt", "esp32c6"] }

critical-section = "1.2.0"
esp-backtrace = { version = "0.18.1", features = [
  "println",
  "esp32c6",
  "panic-handler",
] }
esp-println = { version = "0.16.1", features = ["log-04", "esp32c6"] }
esp-rtos = { version = "0.2.0", features = ["embassy", "esp32c6"] }
esp-alloc = { version = "0.9.0", features = [ "esp32c6" ] }
embassy-executor = "0.9.1"
embassy-time = "0.5.1"

zigbee = { git = "https://github.com/zigbee-rs/zigbee-rs" }
zigbee-mac = { git = "https://github.com/zigbee-rs/zigbee-rs", features = [ "esp32c6" ] }

esp-radio = { version = "0.17.0", features = [
    "ieee802154",
    "unstable",
    "esp32c6",
] }
log = "0.4.29"


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
